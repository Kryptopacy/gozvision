[project]
name = "gozvision-backend"
version = "0.1.0"
description = "GozVision ADK agents — grounded clinical support for the Goz copilot"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "numpy>=2.0,<3",
    "opencv-python-headless>=5.0.0,<5.1",
    "mcp>=1.0.0",
    "python-dotenv>=1.0",
    "supabase>=2.0.0",
]

[tool.uv]
dev-dependencies = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gozvision*"]
