<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GozVision Clinic Suite — The practice platform for eye care clinics. Low Vision Hub, Front Desk, Scribe, and Insights.">
  <meta name="theme-color" content="#050806">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GozVision Clinic">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GozVision Clinic Suite</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #050806; margin: 0; padding: 0;">
  <!-- Bachs Overlay Checkout SDK -->
  <script src="https://checkout.bachs.io/bachs.js"></script>
  <script>
    window.addEventListener('load', function() {
      if (window.Bachs && window.Bachs.Initialize) {
        window.Bachs.Initialize({
          onEvent: function(event) {
            console.log('[Bachs Event]', event.type, event.data);
            window.dispatchEvent(new CustomEvent('bachs_event', { detail: event }));
          }
        });
      }
    });

    window.openBachsCheckout = function(checkoutUrl) {
      if (window.Bachs && window.Bachs.Checkout) {
        return window.Bachs.Checkout.open({ checkoutUrl: checkoutUrl });
      } else {
        window.open(checkoutUrl, '_blank');
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
