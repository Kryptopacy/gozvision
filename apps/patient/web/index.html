<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Goz — The empathetic AI copilot for low-vision patients.">
  <meta name="theme-color" content="#08090C">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Goz Copilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Goz Copilot</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #08090C; margin: 0; padding: 0;">
  <!-- Bachs Overlay Checkout SDK -->
  <script src="https://checkout.bachs.io/bachs.js"></script>
  <script>
    window.addEventListener('load', function() {
      if (window.Bachs && window.Bachs.Initialize) {
        window.Bachs.Initialize({
          onEvent: function(event) {
            console.log('[Bachs Event]', event.type, event.data);
            window.dispatchEvent(new CustomEvent('bachs_event', { detail: event }));
          }
        });
      }
    });

    window.openBachsCheckout = function(checkoutUrl) {
      if (window.Bachs && window.Bachs.Checkout) {
        return window.Bachs.Checkout.open({ checkoutUrl: checkoutUrl });
      } else {
        window.open(checkoutUrl, '_blank');
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
